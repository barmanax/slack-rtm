<!DOCTYPE html>
<html>
<head>
    <title>Mini Slack Chat</title>
</head>
<body>
    <h1>Mini Slack Chat</h1>

    <label for="roomInput">Room:</label>
    <input id="roomInput" type="text" value="general" />

    <button onclick="connectToRoom()">Join Room</button>

    <p id="status">Not connected</p>

    <hr />

    <input id="messageInput" type="text" placeholder="type a message..." />
    <button onclick="sendMessage()">Send</button>

    <ul id="messages"></ul>

    <script>
        const status = document.getElementById("status");
        const roomInput = document.getElementById("roomInput");
        const input = document.getElementById("messageInput");
        const messages = document.getElementById("messages");

        let socket = null;
        let currentRoom = null;

        function connectToRoom() {
            const room = roomInput.value.trim();

            if (room === "") {
                return;
            }

            if (socket !== null) {
                socket.close();
            }

            messages.innerHTML = "";
            currentRoom = room;

            socket = new WebSocket(`ws://127.0.0.1:8000/ws/${room}`);

            socket.onopen = function() {
                status.textContent = `Connected to room: ${room}`;
            };

            socket.onmessage = function(event) {
                const li = document.createElement("li");
                li.textContent = event.data;
                messages.appendChild(li);
            };

            socket.onclose = function() {
                status.textContent = "Disconnected";
            };
        }

        function sendMessage() {
            if (socket === null || socket.readyState !== WebSocket.OPEN) {
                alert("Join a room first.");
                return;
            }

            const text = input.value;

            if (text.trim() === "") {
                return;
            }

            socket.send(text);
            input.value = "";
        }

        input.addEventListener("keydown", function(event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        });
    </script>
</body>
</html>
